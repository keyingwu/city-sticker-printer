<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Sticker Printer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #f0f4f8;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom textured background for the 'desk' */
      .desk-pattern {
        background-color: #e5e5f7;
        opacity: 0.8;
        background-image:  radial-gradient(#444cf7 0.5px, transparent 0.5px), radial-gradient(#444cf7 0.5px, #e5e5f7 0.5px);
        background-size: 20px 20px;
        background-position: 0 0, 10px 10px;
      }
      
      @keyframes print-slide {
        0% { transform: translateY(-100%); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translateY(0); opacity: 1; }
      }
      
      .animate-print {
        animation: print-slide 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
    </style>
